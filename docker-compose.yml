version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ""
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: blessing_auth
      DB_USERNAME: blessing_auth
      DB_PASSWORD: secret
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.mailtrap.io
      MAIL_PORT: 465
      MAIL_ENCRYPTION: ssl
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: "no-reply@example.com"
      MAIL_FROM_NAME: "Blessing Auth"
      TEXTURE_STORAGE_DRIVER: local
      QUEUE_CONNECTION: database
    volumes:
      - textures:/app/storage/textures
      - yggdrasil:/app/storage/yggdrasil
      - backups:/app/storage/backups
      - ./storage/app:/app/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: blessing_auth
      MYSQL_USER: blessing_auth
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33066:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ""
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: blessing_auth
      DB_USERNAME: blessing_auth
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ""
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: blessing_auth
      DB_USERNAME: blessing_auth
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  textures:
  yggdrasil:
  backups:
